services:
  - type: web
    name: kuccpss
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn kuccpss.wsgi:application --config gunicorn.conf.py"
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: kuccpss-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: GUNICORN_WORKERS
        value: "1"
      - key: GUNICORN_THREADS
        value: "2"

databases:
  - name: kuccpss-db
    plan: free
