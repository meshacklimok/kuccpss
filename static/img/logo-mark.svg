<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CareerNext">
  <!-- Rounded tile -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#1e3a8a"/>
  <!-- Rising career path: from "you now" up to your "next" step -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M16 48 Q 30 48 34 34 T 48 16"/>
    <!-- forward / next arrowhead -->
    <path d="M48 26 L48 16 L38 16"/>
  </g>
  <!-- starting point node -->
  <circle cx="16" cy="48" r="5" fill="#ffffff"/>
</svg>
