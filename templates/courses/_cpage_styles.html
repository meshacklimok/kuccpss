{# Shared header / search strip / section styles for course listing pages #}
<style>
body { background: #f8fafc; }

/* ── HEADER ── */
.cpage-header {
  background: #0a0f2c;
  padding: 1.5rem 0 2rem;
  position: relative; overflow: hidden;
}
.cpage-header::before {
  content: '';
  position: absolute; inset: 0;
  background-image: rgba(255,255,255,0.03);
  background-size: 24px 24px;
  pointer-events: none;
}
.cpage-header::after {
  content: '';
  position: absolute;
  width: 380px; height: 380px; border-radius: 50%;
  background: rgba(99,102,241,0.22);
  top: -140px; right: -80px;
  pointer-events: none;
}

.cpage-breadcrumb {
  display: flex; align-items: center; gap: 0.45rem;
  font-size: 0.78rem; margin-bottom: 1.1rem;
  position: relative; z-index: 1;
}
.cpage-breadcrumb a { color: rgba(255,255,255,0.5); text-decoration: none; transition: color 0.15s; }
.cpage-breadcrumb a:hover { color: rgba(255,255,255,0.85); }
.cpage-breadcrumb-sep { color: rgba(255,255,255,0.22); }
.cpage-breadcrumb-cur { color: rgba(255,255,255,0.85); }

.cpage-hero-row { display: flex; align-items: center; gap: 1rem; position: relative; z-index: 1; }
.cpage-icon-badge {
  width: 56px; height: 56px; border-radius: 16px; flex-shrink: 0;
  background: rgba(255,255,255,0.22);
  border: 1px solid rgba(255,255,255,0.18);
  backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.45rem; color: #fff;
}
.cpage-hero-title {
  color: #fff; font-size: 1.65rem; font-weight: 900;
  margin: 0 0 0.2rem; letter-spacing: -0.3px; line-height: 1.15;
}
.cpage-hero-sub { color: rgba(255,255,255,0.52); font-size: 0.82rem; margin: 0; }

/* ── STICKY SEARCH STRIP ── */
.cpage-search-strip {
  background: #fff;
  border-bottom: 1px solid #edf0f4;
  padding: 0.85rem 0;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 16px rgba(0,0,0,0.06);
}
.cpage-search-inner {
  display: flex; align-items: center;
  background: #f1f5f9; border-radius: 12px;
  padding: 0 0.5rem 0 1rem; gap: 0.5rem;
  border: 1.5px solid transparent;
  transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
}
.cpage-search-inner:focus-within {
  border-color: #2563eb; background: #fff;
  box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
}
.cpage-search-inner > i { color: #94a3b8; font-size: 0.9rem; flex-shrink: 0; }
.cpage-search-inner input {
  flex: 1; border: none; background: transparent; outline: none;
  font-size: 0.92rem; color: #1e293b; padding: 0.72rem 0; min-width: 0;
}
.cpage-search-inner input::placeholder { color: #94a3b8; }
.cpage-search-btn {
  background: #2563eb; color: #fff; border: none;
  border-radius: 9px; padding: 0.48rem 1.05rem;
  font-size: 0.82rem; font-weight: 700; cursor: pointer;
  transition: background 0.2s; flex-shrink: 0;
}
.cpage-search-btn:hover { background: #1d4ed8; }

/* ── BODY ── */
.cpage-body { padding: 1.5rem 0 4rem; }

.cpage-section-hd {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem;
}
.cpage-section-hd h2 { font-size: 0.97rem; font-weight: 800; color: #1e293b; margin: 0; }
.cpage-section-hd span { font-size: 0.77rem; font-weight: 600; color: #94a3b8; }

/* ── HERO STATS ── */
.cpage-hero-stats {
  display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1.4rem;
  margin-top: 1.2rem; position: relative; z-index: 1;
}
.cpage-hero-stat { color: rgba(255,255,255,0.55); font-size: 0.8rem; }
.cpage-hero-stat strong { color: #fff; font-size: 1.05rem; font-weight: 800; margin-right: 0.25rem; }
.cpage-hero-cta {
  display: inline-flex; align-items: center; gap: 0.45rem;
  background: #fff; color: #0a0f2c; font-weight: 700; font-size: 0.8rem;
  padding: 0.5rem 0.95rem; border-radius: 10px; text-decoration: none;
  margin-left: auto; transition: transform 0.15s;
}
.cpage-hero-cta:hover { transform: translateY(-1px); color: #0a0f2c; }
@media (max-width: 575px) { .cpage-hero-cta { margin-left: 0; } }

.cpage-section-hd p { font-size: 0.8rem; color: #64748b; margin: 0.15rem 0 0; }


/* ── RESULTS TOOLBAR (count + sort) ── */
.crs-toolbar {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 0.6rem 1rem; margin-bottom: 1rem;
}
.crs-count { font-size: 0.85rem; color: #64748b; margin: 0; }
.crs-count strong { color: #0f172a; }
.crs-sort { display: flex; flex-wrap: wrap; gap: 0.35rem; }
.crs-sort a {
  font-size: 0.75rem; font-weight: 700; color: #475569; text-decoration: none;
  padding: 0.35rem 0.75rem; border-radius: 999px;
  background: #fff; border: 1.5px solid #e2e8f0; transition: border-color 0.15s, color 0.15s;
}
.crs-sort a:hover { border-color: #2563eb; color: #2563eb; }
.crs-sort a.active { background: #0f172a; border-color: #0f172a; color: #fff; }

/* ── COURSE CARD ── */
.crs-card {
  --c: #2563eb;
  position: relative; height: 100%;
  display: flex; flex-direction: column; gap: 0.55rem;
  background: #fff; border: 1.5px solid #edf0f4; border-radius: 14px;
  padding: 1rem 1.05rem 0.9rem;
  box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s;
}
.crs-card:hover { transform: translateY(-3px); border-color: var(--c); box-shadow: 0 10px 24px rgba(15,23,42,0.08); }
.crs-card:has(.crs-link:focus-visible) { outline: 3px solid var(--c); outline-offset: 2px; }
.crs-tags { display: flex; flex-wrap: wrap; gap: 0.3rem; }
.crs-tag {
  font-size: 0.66rem; font-weight: 800; letter-spacing: 0.03em; text-transform: uppercase;
  padding: 0.18rem 0.5rem; border-radius: 6px; background: #f1f5f9; color: #475569;
}
.crs-tag--qual { background: color-mix(in srgb, var(--c) 12%, #fff); color: var(--c); }
.crs-tag--grade { background: #fef2f2; color: #b91c1c; }
.crs-title { font-size: 0.98rem; font-weight: 800; color: #0f172a; line-height: 1.3; margin: 0; }
.crs-link { color: inherit; text-decoration: none; }
.crs-link::after { content: ''; position: absolute; inset: 0; border-radius: 14px; }
.crs-link:hover { color: inherit; text-decoration: none; }
.crs-link:focus-visible { outline: none; }
.crs-sub { font-size: 0.75rem; color: #64748b; margin-top: -0.25rem; }
.crs-desc { font-size: 0.78rem; color: #64748b; line-height: 1.45; margin: 0; }
.crs-foot {
  margin-top: auto; padding-top: 0.65rem; border-top: 1px solid #f1f5f9;
  display: flex; align-items: center; gap: 0.9rem;
  font-size: 0.74rem; color: #64748b; font-weight: 600;
}
.crs-foot i { margin-right: 0.3rem; color: #94a3b8; }
.crs-foot b { color: #0f172a; font-weight: 800; }
.crs-arrow { margin-left: auto; color: #cbd5e1 !important; transition: color 0.2s, transform 0.2s; }
.crs-card:hover .crs-arrow { color: var(--c) !important; transform: translateX(3px); }

/* Dark mode */
body.dark { background: var(--bg); }
body.dark .cpage-search-strip { background: var(--surface); border-color: var(--border-soft); }
body.dark .cpage-search-inner { background: var(--surface-2); }
body.dark .cpage-search-inner:focus-within { background: var(--surface); }
body.dark .cpage-search-inner input { color: var(--text); }
body.dark .cpage-section-hd h2 { color: var(--text); }
body.dark .cpage-section-hd p { color: var(--text-2); }
body.dark .crs-count { color: var(--text-2); }
body.dark .crs-count strong,
body.dark .crs-title,
body.dark .crs-foot b { color: var(--text); }
body.dark .crs-sort a { background: var(--surface); border-color: var(--border); color: var(--text-2); }
body.dark .crs-sort a.active { background: var(--text); border-color: var(--text); color: #000; }
body.dark .crs-card { background: var(--surface); border-color: var(--border-soft); }
body.dark .crs-card:hover { border-color: var(--c); }
body.dark .crs-tag { background: var(--surface-2); color: var(--text-2); }
body.dark .crs-tag--qual { background: color-mix(in srgb, var(--c) 25%, #161719); color: #cfe0ff; }
body.dark .crs-tag--grade { background: rgba(248,113,113,0.15); color: #fca5a5; }
body.dark .crs-sub, body.dark .crs-desc, body.dark .crs-foot { color: var(--text-2); }
body.dark .crs-foot { border-top-color: var(--border); }
</style>
