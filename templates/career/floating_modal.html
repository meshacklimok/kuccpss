<form id="floatingEligibilityForm" class="p-3 bg-light shadow rounded">
    {% csrf_token %}
    <div class="mb-2">
        <label>Cluster Points</label>
        <input type="number" step="0.01" name="cluster_points" class="form-control" placeholder="e.g., 34.0" required>
    </div>

    <div class="mb-2">
        <label>Course Type</label>
        <select name="course_type" class="form-select" required>
            <option value="degree">Degree</option>
            <option value="diploma">Diploma</option>
            <option value="certificate">Certificate</option>
            <option value="short_course">Short Course</option>
        </select>
    </div>

    <div class="mb-2">
        <label>Preferred Institution Types (Optional)</label>
        <div class="form-check">
            <input type="checkbox" name="institution_type[]" value="public" class="form-check-input" id="instPublic">
            <label class="form-check-label" for="instPublic">Public University</label>
        </div>
        <div class="form-check">
            <input type="checkbox" name="institution_type[]" value="private" class="form-check-input" id="instPrivate">
            <label class="form-check-label" for="instPrivate">Private University</label>
        </div>
        <div class="form-check">
            <input type="checkbox" name="institution_type[]" value="tvet" class="form-check-input" id="instTVET">
            <label class="form-check-label" for="instTVET">TVET College</label>
        </div>
        <div class="form-check">
            <input type="checkbox" name="institution_type[]" value="ttc" class="form-check-input" id="instTTC">
            <label class="form-check-label" for="instTTC">Teacher Training College</label>
        </div>
    </div>

    <button type="submit" class="btn btn-success w-100 mb-2">Check Eligibility</button>
    <button type="button" id="aiGuidanceBtn" class="btn btn-warning w-100">Get AI Guidance</button>

    <div id="eligibilityResults" class="mt-3"></div>
    <div id="aiResults" class="mt-3"></div>
</form>

<script>
document.getElementById('floatingEligibilityForm').addEventListener('submit', async function(e){
    e.preventDefault();
    const formData = new FormData(this);
    const response = await fetch("{% url 'career:floating_eligibility' %}", {
        method: 'POST',
        headers: {'X-CSRFToken': formData.get('csrfmiddlewaretoken')},
        body: formData
    });
    const data = await response.json();
    const container = document.getElementById('eligibilityResults');
    container.innerHTML = '';
    if(data.eligible_courses){
        data.eligible_courses.forEach(c => {
            const color = c.status === 'qualified' ? 'success' : c.status === 'borderline' ? 'warning' : 'danger';
            container.innerHTML += `
            <div class="card text-white bg-${color} mb-2">
                <div class="card-body">
                    <h5 class="card-title">${c.course_name}</h5>
                    <p class="card-text">${c.institution} - Min Points: ${c.min_points}</p>
                </div>
            </div>`;
        });
    }
});

document.getElementById('aiGuidanceBtn').addEventListener('click', async function(){
    const userInput = `I have ${document.querySelector('[name="cluster_points"]').value} points and I want a ${document.querySelector('[name="course_type"]').value} course.`;
    const response = await fetch("{% url 'career:ai_guidance' %}", {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'X-CSRFToken': document.querySelector('[name="csrfmiddlewaretoken"]').value
        },
        body: new URLSearchParams({'user_input': userInput})
    });
    const data = await response.json();
    document.getElementById('aiResults').innerHTML = `<div class="alert alert-info">${data.response}</div>`;
});
</script>
