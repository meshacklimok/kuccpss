{% extends "base.html" %}
{% load static %}

{% block title %}Password Changed — CareerNext{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card" style="max-width:420px;text-align:center;">

    <!-- Success icon with animation -->
    <div style="width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,#16a34a,#15803d);
                display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem;
                box-shadow:0 8px 24px rgba(22,163,74,0.35);
                animation:successPop 0.5s cubic-bezier(0.34,1.56,0.64,1) both;">
      <i class="fas fa-check" style="color:#fff;font-size:1.6rem;"></i>
    </div>

    <h2 class="fw-bold mb-2" style="font-size:1.35rem;color:#0f172a;">Password updated!</h2>
    <p class="text-muted mb-4" style="font-size:0.9rem;line-height:1.6;">
      Your password has been changed successfully.<br>
      You can now sign in with your new password.
    </p>

    <a href="{% url 'accounts:login' %}" class="btn-auth-submit" style="display:block;text-decoration:none;text-align:center;">
      <i class="fas fa-sign-in-alt me-2"></i>Sign In Now
    </a>

  </div>
</div>

<style>
@keyframes successPop {
  from { transform: scale(0.5); opacity: 0; }
  to   { transform: scale(1);   opacity: 1; }
}
</style>
{% endblock %}
