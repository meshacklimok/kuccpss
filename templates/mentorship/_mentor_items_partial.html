{% for mentor in page_obj %}
{% include 'mentorship/_mentor_card.html' %}
{% endfor %}

{% if page_obj.has_next %}
<div id="load-more-sentinel" class="col-12 d-flex justify-content-center py-5"
     hx-get="?page={{ page_obj.next_page_number }}{% if query %}&q={{ query }}{% endif %}{% if filter_institution %}&institution={{ filter_institution }}{% endif %}{% if filter_year %}&year={{ filter_year }}{% endif %}{% if filter_rating %}&rating={{ filter_rating }}{% endif %}"
     hx-trigger="intersect once"
     hx-target="#load-more-sentinel"
     hx-swap="outerHTML">
  <div class="d-flex flex-column align-items-center gap-2 text-muted">
    <div class="spinner-border spinner-border-sm text-primary" role="status">
      <span class="visually-hidden">Loading…</span>
    </div>
    <span class="small">Loading more…</span>
  </div>
</div>
{% endif %}
